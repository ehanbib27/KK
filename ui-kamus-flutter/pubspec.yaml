name: ui_kamus_aplikasi
description: Aplikasi Kamus Kutai berbasis Flutter, hasil adaptasi prototipe web multi-halaman.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  image: ^4.3.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/kosakata_lengkap.json
    - assets/data/kategori.json
